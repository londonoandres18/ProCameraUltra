name: Build NFC Studio APK

on:
  push:
    branches: ["main"]
    paths:
      - "NFCStudio/**"
      - ".github/workflows/build-nfc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nfc-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Verify project
        run: |
          test -f NFCStudio/settings.gradle.kts
          test -f NFCStudio/app/build.gradle.kts
          test -f NFCStudio/app/src/main/AndroidManifest.xml
      - name: Compile debug APK
        working-directory: NFCStudio
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NFCStudio-debug-APK
          path: NFCStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NFCStudio-build-diagnostics
          path: |
            NFCStudio/app/build/reports/**
            NFCStudio/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
