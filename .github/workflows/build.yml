name: Build ProCamera Ultra APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify and extract full source bundle
        run: |
          unzip -t ProCameraUltra-source.zip
          mkdir -p _source
          unzip -q -o ProCameraUltra-source.zip -d _source
          test -f _source/ProCameraUltra/app/src/main/java/com/procamerault/f8ultra/camera/CameraScreen.kt
          test -f _source/ProCameraUltra/app/src/main/java/com/procamerault/f8ultra/processing/MultiFrameFusion.kt

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Compile debug APK
        working-directory: _source/ProCameraUltra
        run: gradle --no-daemon clean assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCameraUltra-debug-APK
          path: _source/ProCameraUltra/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
